<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beat Sun’s Champion!</title>
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./answers.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <main>
    <h1>Beat Sun’s Champion!</h1>
    <nav class="page-nav" aria-label="Game information">
      <a href="./rule.html">Rules</a>
      <a href="./note.html">Notes</a>
    </nav>
    <section class="guess-panel" aria-label="Submit an answer">
      <p id="progress" role="status">The new puzzle is coming soon.</p>
      <form id="guess-form" hidden>
        <label for="guess">Card name</label>
        <div class="guess-controls">
          <div class="card-picker">
            <input id="guess" name="guess" type="text" role="combobox" aria-autocomplete="list"
              aria-controls="card-suggestions" aria-expanded="false" autocomplete="off" enterkeyhint="go" required>
            <ul id="card-suggestions" role="listbox" aria-label="Card suggestions" hidden></ul>
          </div>
          <button type="submit">Check</button>
        </div>
      </form>
      <p id="feedback" role="status">Try "Barren Glory" and "Laboratory Maniac".</p>
    </section>
    <table id="answers" aria-label="Puzzle answers" hidden>
      <thead>
        <tr>
          <th scope="col">Code</th>
          <th scope="col">Status</th>
          <th scope="col">Card name</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="progress-controls">
      <button type="button" id="share-progress" aria-haspopup="dialog" hidden>Share Progress</button>
      <button type="button" id="reset-progress" hidden>Reset progress</button>
    </div>
    <dialog id="share-dialog" aria-labelledby="share-title">
      <h2 id="share-title">Share Progress</h2>
      <div class="share-tabs" role="tablist" aria-label="Share format">
        <button type="button" id="share-tab-text" role="tab" aria-selected="true" aria-controls="share-panel-text">Text</button>
        <button type="button" id="share-tab-png" role="tab" aria-selected="false" aria-controls="share-panel-png" tabindex="-1">PNG</button>
      </div>
      <div id="share-panel-text" role="tabpanel" aria-labelledby="share-tab-text">
        <textarea id="share-text" aria-label="Progress to share" rows="12" readonly autofocus></textarea>
      </div>
      <div id="share-panel-png" role="tabpanel" aria-labelledby="share-tab-png" hidden>
        <canvas id="share-image" role="img" aria-label="Progress image preview"></canvas>
        <button type="button" id="download-progress">Download PNG</button>
        <p id="share-image-error" role="status" hidden></p>
      </div>
      <form method="dialog">
        <button>Close</button>
      </form>
    </dialog>
  </main>
</body>
</html>
